name: Film feedback
description: A note on the film itself (a shot, a caption, the music, a scientific or historical detail).
labels: [film]
body:
  - type: input
    id: film
    attributes:
      label: Version
      description: The release you watched (see the Releases page), or the commit you built.
      placeholder: v1.0
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Timestamp
      description: Where in the film (mm:ss), or the beat name from timeline.json.
      placeholder: "3:55 (moonlanding)"
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: What you noticed
      description: What looks, sounds or reads wrong or could be better. For scientific points, a source helps.
    validations:
      required: true
