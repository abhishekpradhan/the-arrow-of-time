name: Render on Modal

# Renders a film on Modal with tools/modal/studio.py (parallel CPU containers, cached slices) and
# optionally publishes it as a GitHub Release. Setup (docs/modal.md): add the repository secrets
# MODAL_TOKEN_ID and MODAL_TOKEN_SECRET; optionally set the repository variable MODAL_ENVIRONMENT
# to keep these runs in their own Modal environment.

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project id (a folder in projects/)
        required: true
        default: arrow-of-time
      preset:
        description: final (full resolution, motion blur) or draft (half resolution)
        type: choice
        options: [final, draft]
        default: final
      scale:
        description: Resolution scale (0 = the preset's default, 2 = 4K)
        default: '0'
      window:
        description: Re-render only this range in seconds, e.g. 182-216 (empty = the whole film)
        default: ''
      variants:
        description: Distribution encodes (2160p needs scale 2)
        default: 1080p,720p,poster
      tag:
        description: Publish a GitHub Release with this tag, e.g. arrow-of-time-v0.3 (empty = no release)
        default: ''
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: render-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROJECT: ${{ inputs.project }}
      PRESET: ${{ inputs.preset }}
      SCALE: ${{ inputs.scale }}
      WINDOW: ${{ inputs.window }}
      VARIANTS: ${{ inputs.variants }}
      TAG: ${{ inputs.tag }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r tools/modal/requirements.txt

      - name: Render on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          ENVIRONMENT: ${{ vars.MODAL_ENVIRONMENT }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Add the MODAL_TOKEN_ID and MODAL_TOKEN_SECRET repository secrets (see docs/modal.md)."
            exit 1
          fi
          if [ -n "$ENVIRONMENT" ]; then export MODAL_ENVIRONMENT="$ENVIRONMENT"; fi
          args=(--project "$PROJECT" --preset "$PRESET" --scale "$SCALE" --release --variants "$VARIANTS" --download release)
          if [ -n "$WINDOW" ]; then args+=(--window "$WINDOW"); fi
          modal run tools/modal/studio.py "${args[@]}"

      - name: Keep the 720p preview for a week
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-preview
          path: out/${{ inputs.project }}/release/*-720p.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish the GitHub Release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_notes.py "$PROJECT" --tag "$TAG" > notes.md
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" out/"$PROJECT"/release/* --target "$GITHUB_SHA" \
            --title "$(python3 tools/release_notes.py "$PROJECT" --tag "$TAG" --title)" --notes-file notes.md "${flags[@]}"
