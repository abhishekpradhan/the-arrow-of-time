name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: pip install -r requirements.txt
      - name: Typecheck the engine, the film and the tools
        run: npm run typecheck
      - name: Compile the Python (the Modal pipeline needs no Modal account to check)
        run: python -m py_compile film/score.py audio/*.py tools/*.py tools/modal/*.py tools/assets/*.py tools/assets/giant_impact/*.py
      - name: Synthesize the score
        run: npm run audio
      - name: Check the score's hits and cuts against the timeline
        run: |
          python audio/analyze.py out/audio/score.wav --timeline film/timeline.json \
            --onsets bang theia asteroidImpact launch staging orbitalDawn reflection blueDot --cut now
